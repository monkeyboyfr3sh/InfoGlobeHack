<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InfoGlobe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 16px; max-width: 520px; margin: 0 auto; }
    h1 { text-align: center; color: #e94560; margin: 16px 0; }
    .card { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    h2 { color: #e94560; font-size: 1rem; margin-bottom: 10px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; background: #0f3460; color: #eee; border: 1px solid #e94560; border-radius: 4px; margin-bottom: 8px; }
    button { background: #e94560; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin: 3px; }
    button:hover { background: #c73652; }
    label { font-size: .9rem; display: flex; align-items: center; gap: 4px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; display: none; font-weight: bold; }
    .ok { background: #155724; color: #d4edda; }
    .err { background: #721c24; color: #f8d7da; }
    progress { width: 100%; margin-top: 8px; accent-color: #e94560; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #0f3460; border-radius: 26px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background: #eee; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background: #e94560; }
    input:checked + .slider:before { transform: translateX(22px); }
  </style>
</head>
<body>
  <h1>InfoGlobe</h1>
  <div id="toast"></div>

  <div class="card">
    <div class="toggle-row">
      <h2 style="margin:0">Display Mode</h2>
      <div style="display:flex;align-items:center;gap:10px;font-size:.9rem">
        <span id="mode-label">Time</span>
        <label class="switch">
          <input type="checkbox" id="time-toggle" checked onchange="setMode(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Send Text</h2>
    <input type="text" id="txt" placeholder="Message...">
    <div class="row">
      <label><input type="checkbox" id="blink"> Blink</label>
      <button onclick="sendText()">Send Text</button>
      <button onclick="sendRaw()">Send Raw Hex</button>
    </div>
  </div>

  <div class="card">
    <h2>Buttons</h2>
    <div class="row" style="margin-bottom:8px">
      <input type="text" id="cmd" placeholder="Configure button command..." style="flex:1;margin:0">
      <label><input type="checkbox" id="cfg"> Configure</label>
    </div>
    <div class="grid" id="btns"></div>
  </div>

  <div class="card">
    <h2>IR Link</h2>
    <div class="row" style="margin-bottom:8px">
      <label>Gap after each frame
        <input type="number" id="gap" min="0" max="500" style="width:70px;padding:6px;background:#0f3460;color:#eee;border:1px solid #e94560;border-radius:4px"> ms
      </label>
      <button onclick="setGap()">Set</button>
    </div>
    <div class="toggle-row" style="margin-bottom:8px">
      <span style="font-size:.9rem">Max-rate test pattern (TEST 000-999)</span>
      <label class="switch">
        <input type="checkbox" id="ir-test" onchange="setIrTest(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <p id="ir-stats" style="font-size:.9rem;opacity:.85">&nbsp;</p>
  </div>

  <div class="card">
    <h2>OTA Firmware Update</h2>
    <input type="file" id="bin" accept=".bin">
    <button onclick="doOTA()">Flash Firmware</button>
    <progress id="prog" value="0" max="100" style="display:none"></progress>
    <p id="ota-msg" style="margin-top:8px;font-size:.9rem"></p>
  </div>

  <script>
    (function() {
      var g = document.getElementById('btns');
      for (var i = 1; i <= 6; i++) {
        var b = document.createElement('button');
        b.textContent = 'Button ' + i;
        b.onclick = (function(n) { return function() { btnClick(n); }; })(i);
        g.appendChild(b);
      }
    })();

    function toast(msg, ok) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = ok === false ? 'err' : 'ok';
      t.style.display = 'block';
      setTimeout(function() { t.style.display = 'none'; }, 2500);
    }

    async function post(url, data) {
      try {
        var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        return r.ok;
      } catch(e) { return false; }
    }

    function sendText() {
      var text = document.getElementById('txt').value;
      var blink = document.getElementById('blink').checked;
      if (!text) { toast('Enter a message', false); return; }
      post('/text', { text: text, blink: blink }).then(function(ok) { toast(ok ? 'Sent!' : 'Failed', ok); });
    }

    function sendRaw() {
      var hex = document.getElementById('txt').value.replace(/[^0-9a-fA-F]/g, '');
      if (!hex) { toast('Enter hex bytes', false); return; }
      post('/raw', { hex: hex }).then(function(ok) { toast(ok ? 'Sent!' : 'Failed', ok); });
    }

    function btnClick(n) {
      var cfg = document.getElementById('cfg').checked;
      var cmd = document.getElementById('cmd').value;
      document.getElementById('cfg').checked = false;
      var body = cfg ? { button: n, config: true, command: cmd } : { button: n };
      post('/button', body).then(function(ok) {
        toast(ok ? (cfg ? 'Button ' + n + ' configured' : 'Button ' + n + ' triggered') : 'Failed', ok);
      });
      if (cfg) document.getElementById('cmd').value = '';
    }

    function setMode(timeOn) {
      document.getElementById('mode-label').textContent = timeOn ? 'Time' : 'Message';
      post('/mode', { time_mode: timeOn }).then(function(ok) {
        toast(ok ? (timeOn ? 'Showing time' : 'Showing message') : 'Failed', ok);
      });
    }

    // Sync toggle with device state on load
    fetch('/mode').then(function(r) { return r.json(); }).then(function(d) {
      var t = document.getElementById('time-toggle');
      t.checked = d.time_mode;
      document.getElementById('mode-label').textContent = d.time_mode ? 'Time' : 'Message';
    }).catch(function() {});

    // IR link: stats refresh, gap tuning, test pattern
    var gapLoaded = false;
    function showIr(d) {
      document.getElementById('ir-stats').textContent =
        d.fps.toFixed(1) + ' frames/s · link ' + Math.round(d.busy_pct) + '% busy · ' +
        d.frames + ' frames sent';
      document.getElementById('ir-test').checked = d.test;
      if (!gapLoaded) { document.getElementById('gap').value = d.gap_ms; gapLoaded = true; }
    }
    function pollIr() {
      fetch('/ir').then(function(r) { return r.json(); }).then(showIr).catch(function() {});
    }
    async function postIr(body) {
      try {
        var r = await fetch('/ir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (r.ok) { showIr(await r.json()); return true; }
      } catch (e) {}
      return false;
    }
    function setGap() {
      var v = parseInt(document.getElementById('gap').value, 10);
      if (isNaN(v) || v < 0 || v > 500) { toast('Gap must be 0-500 ms', false); return; }
      postIr({ gap_ms: v }).then(function(ok) { toast(ok ? 'Gap set to ' + v + ' ms' : 'Failed', ok); });
    }
    function setIrTest(on) {
      postIr({ test: on }).then(function(ok) { toast(ok ? (on ? 'Test pattern running' : 'Test pattern stopped') : 'Failed', ok); });
    }
    pollIr();
    setInterval(pollIr, 2000);

    function doOTA() {
      var f = document.getElementById('bin').files[0];
      if (!f) { toast('No file selected', false); return; }
      var prog = document.getElementById('prog');
      var msg = document.getElementById('ota-msg');
      var reader = new FileReader();
      reader.onload = function(e) {
        var buf = e.target.result;
        prog.style.display = 'block';
        prog.value = 0;
        msg.textContent = 'Uploading ' + f.name + '...';
        var xhr = new XMLHttpRequest();
        xhr.upload.onprogress = function(ev) {
          if (ev.lengthComputable) prog.value = Math.round(ev.loaded / ev.total * 100);
        };
        xhr.onload = function() {
          if (xhr.status === 200) {
            msg.textContent = 'Flash complete! Rebooting...';
          } else {
            msg.textContent = 'OTA failed: ' + xhr.responseText;
            toast('OTA Failed', false);
          }
        };
        xhr.onerror = function() { msg.textContent = 'Connection error'; toast('Error', false); };
        xhr.open('POST', '/ota');
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.send(buf);
      };
      reader.readAsArrayBuffer(f);
    }
  </script>
</body>
</html>
